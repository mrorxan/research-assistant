name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check researcher/ scripts/ tests/
      - name: Type check
        run: mypy
      - name: Test with coverage gate
        run: pytest --cov=researcher --cov-fail-under=60 --cov-report=term-missing
      - name: Provided smoke tests
        run: pytest tests/test_ai_smoke.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t research-assistant .