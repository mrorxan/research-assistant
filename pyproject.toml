[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher"
version = "1.0.0"
description = "Async research assistant with cited answers. AI-ENG-110 final project."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "tenacity>=9.1",
    "click>=8.4",
    "google-genai>=2.12",
]

[tool.setuptools.packages.find]
include = ["researcher*", "ai*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
source = ["researcher"]
omit = ["researcher/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ai", "tests/test_ai_smoke.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["researcher"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ai.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["dotenv"]
ignore_missing_imports = true